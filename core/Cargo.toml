[package]
name = "sharemask-core"
version = "0.1.0"
edition = "2021"
description = "Platform-independent region resolution for sharemask (presets × window geometry → pixel rects)"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
crate-type = ["rlib", "staticlib", "cdylib"]
